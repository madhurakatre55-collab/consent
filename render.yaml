services:
  - type: web
    name: consent-paypal-mandate
    env: node
    plan: free
    buildCommand: "npm install --include=dev --prefix server && npm install --include=dev --prefix web && npm run build && node server/dist/db/seed.js"
    startCommand: "npm run start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: PORT
        value: 10000
      - key: LLM_PROVIDER
        value: mock
      - key: DEMO_MODE
        value: true
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: LLM_API_KEY
        sync: false
